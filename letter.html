<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Letter ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #24000d, #650d2d, #2b0014);
            font-family: Georgia, serif;
            text-align: center;
            color: #fff0e6;
        }

        .letter-card {
            width: 85%;
            max-width: 500px;
            padding: 45px 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 160, 0.5);
            border-radius: 25px;
            box-shadow: 0 0 35px rgba(255, 190, 120, 0.15);
        }

        .letter-card h1 {
            color: #f8d9b0;
            font-size: 27px;
            margin-bottom: 35px;
        }

        .special-phrase {
            color: #ffd700;
            font-size: 30px;
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 8px #c99b35;
            }
            to {
                text-shadow: 0 0 25px #ffd700;
            }
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 25px;
            border-radius: 30px;
            background: #d4af6a;
            color: #3b071b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="letter-card">
        <h1>💌 A Special Letter</h1>

        <p class="special-phrase">kuwa mjasiri boiiiz</p>

        <a href="index.html" class="back-link">Return ❤️</a>
    </div>

</body>
</html>
